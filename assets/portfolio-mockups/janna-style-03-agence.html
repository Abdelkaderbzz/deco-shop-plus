<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Un magasin électronique prêt</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .stage {
      width: 1080px; height: 1920px;
      padding: 80px 64px 72px;
      background: #efece6;
      display: flex; flex-direction: column; align-items: center;
      font-family: Outfit, sans-serif; color: #1c2422;
    }
    .kicker {
      font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase;
      color: #0f5c64; font-weight: 600; margin-bottom: 12px;
    }
    .lead {
      font-family: "Cormorant Garamond", serif;
      font-size: 50px; font-weight: 600; text-align: center;
      line-height: 1.08; margin-bottom: 36px; max-width: 14ch;
    }
    .card {
      width: 100%; flex: 1; background: #fbfcfa; border-radius: 36px;
      padding: 40px 36px 28px;
      box-shadow: 0 28px 70px rgba(15, 92, 100, 0.10);
      display: flex; flex-direction: column;
    }
    .logo { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 16px; box-shadow: 0 8px 20px rgba(15,92,100,.18); }
    .card h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 40px; text-align: center; font-weight: 600; line-height: 1.1;
    }
    .sub {
      text-align: center; margin-top: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; font-size: 13px; color: #0f5c64; font-weight: 600;
    }
    .rule { width: 90px; height: 1px; background: #b08d4a; margin: 16px auto 28px; position: relative; }
    .rule::after { content: "◆"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 9px; color: #b08d4a; }
    .split { display: grid; grid-template-columns: .82fr 1.18fr; gap: 16px; flex: 1; min-height: 0; }
    .features { display: flex; flex-direction: column; justify-content: center; gap: 30px; padding-left: 8px; }
    .feature { display: flex; align-items: center; gap: 14px; }
    .icon {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1.5px solid #b08d4a; color: #0f5c64;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .feature span { font-size: 18px; font-weight: 500; }
    .shot {
      border-radius: 22px; overflow: hidden; min-height: 0;
      box-shadow: 0 18px 40px rgba(13,21,20,.16);
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: 55% 58%; display: block; }
    .footer { margin-top: 32px; text-align: center; width: 100%; }
    .line { color: #6a7a76; font-size: 16px; margin-bottom: 18px; }
    .made { font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: #0f5c64; font-weight: 600; margin-bottom: 8px; }
    .agency { font-size: 26px; font-weight: 600; }
    .agency i { font-style: normal; color: #2f8f4e; margin-right: 7px; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="kicker">E-commerce clé en main</p>
    <p class="lead">Un magasin électronique prêt</p>
    <div class="card">
      <img class="logo" src="logo.webp" alt="" />
      <h2>Un magasin électronique prêt</h2>
      <p class="sub">Coussins & déco maison</p>
      <div class="rule"></div>
      <div class="split">
        <div class="features">
          <div class="feature">
            <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/></svg></div>
            <span>Catalogue visuel</span>
          </div>
          <div class="feature">
            <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg></div>
            <span>Commande simple</span>
          </div>
          <div class="feature">
            <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.5 4.5H18l-3.5 2.8 1.3 4.5L12 12.8 8.2 14.8l1.3-4.5L6 7.5h4.5z"/></svg></div>
            <span>Design sur mesure</span>
          </div>
        </div>
        <div class="shot">
          <img src="scene-laptop-fabric-live.png" alt="Site sur ordinateur" />
        </div>
      </div>
    </div>
    <div class="footer">
      <p class="line">Coussins & galettes — atelier Bizerte</p>
      <p class="made">Une réalisation</p>
      <p class="agency"><i>✦</i>revixa</p>
    </div>
  </div>
</body>
</html>
