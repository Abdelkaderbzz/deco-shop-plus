<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Deco Shop Plus — Étude de cas</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #efece6; }
    .stage {
      width: 1080px;
      height: 1920px;
      padding: 88px 64px 72px;
      background: #efece6;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Outfit, sans-serif;
      color: #1c2422;
    }
    .kicker {
      font-size: 13px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #0f5c64;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .lead {
      font-family: "Cormorant Garamond", serif;
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 42px;
    }
    .photo {
      width: 100%;
      flex: 1;
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 28px 70px rgba(15, 92, 100, 0.12);
      background: #d8d2c8;
    }
    .photo img.scene {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
      display: block;
    }
    .photo .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(251,252,250,.18) 0%, transparent 22%, transparent 78%, rgba(15,21,20,.18) 100%);
      pointer-events: none;
    }
    .caption {
      position: absolute;
      left: 40px;
      top: 40px;
      z-index: 2;
    }
    .caption .small {
      font-size: 13px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #b08d4a;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .caption h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 42px;
      font-weight: 600;
      color: #1c2422;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
    }
    .rule {
      width: 88px;
      height: 1px;
      background: #b08d4a;
      margin: 14px 0 12px;
      position: relative;
    }
    .rule::after {
      content: "◆";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 9px;
      color: #b08d4a;
      background: transparent;
    }
    .caption p {
      font-size: 15px;
      color: #4a5b58;
    }
    .logo-mark {
      position: absolute;
      left: 40px;
      bottom: 40px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 10px 24px rgba(13,21,20,.22);
      z-index: 2;
    }
    .footer {
      margin-top: 36px;
      text-align: center;
      width: 100%;
    }
    .footer .line {
      color: #6a7a76;
      font-size: 16px;
      margin-bottom: 22px;
    }
    .made {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #0f5c64;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .agency {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .agency i {
      font-style: normal;
      color: #2f8f4e;
      margin-right: 7px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="kicker">Étude de cas</p>
    <p class="lead">Deco Shop Plus</p>
    <div class="photo">
      <img class="scene" src="scene-cover-laptop-live.png" alt="Deco Shop Plus sur ordinateur" />
      <div class="veil"></div>
      <div class="caption">
        <p class="small">Étude de cas</p>
        <h2>Deco Shop Plus</h2>
        <div class="rule"></div>
        <p>Boutique e-commerce • Maison & coussins • Tunisie</p>
      </div>
      <img class="logo-mark" src="logo.webp" alt="Deco Shop Plus" />
    </div>
    <div class="footer">
      <p class="line">Boutique e-commerce • Maison & coussins • Tunisie</p>
      <p class="made">Une réalisation</p>
      <p class="agency"><i>✦</i>revixa</p>
    </div>
  </div>
</body>
</html>
