<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Deco Shop Plus — Multi screen mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #f1f4f2 0%, #dde8e4 45%, #c9d8d4 100%);
      color: #0d1514;
    }
    .stage {
      width: 1600px;
      height: 1000px;
      padding: 52px 56px;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 36px;
    }
    .eyebrow {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 11px;
      color: #0f5c64;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 36px;
      letter-spacing: -0.03em;
      font-weight: 650;
    }
    .right {
      text-align: right;
      color: #4a5b58;
      font-size: 14px;
      line-height: 1.5;
    }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 1fr 0.55fr;
      gap: 28px;
      align-items: end;
    }
    .frame {
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 24px 50px rgba(13, 21, 20, 0.12);
      border: 1px solid rgba(15, 92, 100, 0.08);
    }
    .frame img {
      display: block;
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
      object-position: top center;
    }
    .frame.home img { aspect-ratio: 16 / 10; height: auto; }
    .frame.product img { aspect-ratio: 16 / 10; height: auto; }
    .frame.phone {
      padding: 10px;
      border-radius: 28px;
      max-width: 260px;
      margin: 0 auto;
      background: #111;
      border: 2px solid #2a2f2e;
      box-shadow: 0 28px 50px rgba(13, 21, 20, 0.22);
    }
    .frame.phone img {
      border-radius: 20px;
      aspect-ratio: 390 / 844;
    }
    .caption {
      margin-top: 12px;
      font-size: 13px;
      color: #4a5b58;
      letter-spacing: 0.04em;
    }
    .frame.phone .caption { color: #c5d4d1; text-align: center; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="top">
      <div>
        <p class="eyebrow">Case study · Web design</p>
        <h1>Deco Shop Plus</h1>
      </div>
      <div class="right">
        E-commerce atelier<br />
        Accueil · Produit · Mobile
      </div>
    </div>
    <div class="grid">
      <div>
        <div class="frame home">
          <img src="01-home-desktop.png" alt="Accueil" />
        </div>
        <p class="caption">Page d’accueil</p>
      </div>
      <div>
        <div class="frame product">
          <img src="02-product-desktop.png" alt="Produit" />
        </div>
        <p class="caption">Fiche produit</p>
      </div>
      <div>
        <div class="frame phone">
          <img src="05-product-mobile.png" alt="Mobile produit" />
        </div>
        <p class="caption" style="text-align:center;color:#4a5b58">Vue mobile</p>
      </div>
    </div>
  </div>
</body>
</html>
