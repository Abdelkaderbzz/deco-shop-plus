<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Catalogue — Prêt</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .stage {
      width: 1080px; height: 1080px;
      padding: 40px 44px 32px;
      background: #efece6;
      display: flex; flex-direction: column; align-items: center;
      font-family: Outfit, sans-serif; color: #1c2422;
    }
    .kicker {
      font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase;
      color: #0f5c64; font-weight: 600; margin-bottom: 6px;
    }
    .lead {
      font-family: "Cormorant Garamond", serif;
      font-size: 42px; font-weight: 600; margin-bottom: 18px; text-align: center;
    }
    .card {
      width: 100%; flex: 1; background: #fbfcfa; border-radius: 28px;
      padding: 22px 22px 18px;
      box-shadow: 0 22px 50px rgba(15,92,100,.10);
      display: grid; grid-template-columns: .78fr 1.22fr; gap: 16px; align-items: center;
    }
    .left { padding-left: 10px; }
    .logo { width: 62px; height: 62px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; }
    .left h2 {
      font-family: "Cormorant Garamond", serif; font-size: 30px; font-weight: 600; line-height: 1.1;
    }
    .sub {
      margin: 8px 0 16px; letter-spacing: 0.14em; text-transform: uppercase;
      font-size: 11px; color: #0f5c64; font-weight: 600;
    }
    .feature { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 16px; }
    .icon {
      width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #b08d4a;
      color: #0f5c64; display: grid; place-items: center; flex-shrink: 0;
    }
    .shot { height: 100%; border-radius: 18px; overflow: hidden; }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: 55% 58%; display: block; }
    .footer { margin-top: 16px; text-align: center; width: 100%; font-size: 15px; color: #6a7a76; }
    .agency { margin-top: 8px; font-size: 20px; font-weight: 600; }
    .agency i { font-style: normal; color: #2f8f4e; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="kicker">E-commerce clé en main</p>
    <p class="lead">Un magasin électronique prêt</p>
    <div class="card">
      <div class="left">
        <img class="logo" src="logo.webp" alt="" />
        <h2>Deco Shop Plus</h2>
        <p class="sub">Coussins & déco maison</p>
        <div class="feature"><div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/></svg></div>Catalogue visuel</div>
        <div class="feature"><div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/></svg></div>Commande simple</div>
        <div class="feature"><div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.5 4.5H18l-3.5 2.8 1.3 4.5L12 12.8 8.2 14.8l1.3-4.5L6 7.5h4.5z"/></svg></div>Design sur mesure</div>
      </div>
      <div class="shot"><img src="scene-laptop-fabric-live.png" alt="" /></div>
    </div>
    <p class="footer">Atelier Bizerte — site livré</p>
    <p class="agency"><i>✦</i>revixa</p>
  </div>
</body>
</html>
