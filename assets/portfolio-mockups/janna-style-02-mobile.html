<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>La boutique dans la poche</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .stage {
      width: 1080px; height: 1920px;
      padding: 88px 64px 72px;
      background: #efece6;
      display: flex; flex-direction: column; align-items: center;
      font-family: Outfit, sans-serif; color: #1c2422;
    }
    .kicker {
      font-size: 13px; letter-spacing: 0.38em; text-transform: uppercase;
      color: #0f5c64; font-weight: 600; margin-bottom: 14px;
    }
    .lead {
      font-family: "Cormorant Garamond", serif;
      font-size: 54px; font-weight: 600; text-align: center;
      line-height: 1.06; margin-bottom: 42px; max-width: 13ch;
    }
    .photo {
      width: 100%; flex: 1; border-radius: 36px; overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 78% 38%, rgba(255,255,255,.55), transparent 42%),
        linear-gradient(165deg, #e8eeea 0%, #d5dfdb 55%, #c8d4cf 100%);
      box-shadow: 0 28px 70px rgba(15, 92, 100, 0.12);
    }
    .bg-prop {
      position: absolute; right: -4%; bottom: 8%;
      width: 58%; transform: rotate(5deg);
      filter: drop-shadow(0 28px 36px rgba(13,21,20,.28));
      border-radius: 18px;
    }
    .phone {
      position: absolute; left: 8%; top: 9%;
      width: 390px;
      background: #0c0e0d;
      border-radius: 46px;
      padding: 12px;
      border: 2px solid #2a312f;
      box-shadow: 0 40px 70px rgba(13,21,20,.38);
      z-index: 2;
    }
    .notch {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      width: 92px; height: 20px; background: #0c0e0d; border-radius: 20px; z-index: 3;
    }
    .screen {
      border-radius: 36px; overflow: hidden; aspect-ratio: 390/844; background: #111;
    }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .footer { margin-top: 36px; text-align: center; width: 100%; }
    .line { color: #6a7a76; font-size: 16px; margin-bottom: 22px; }
    .made { font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: #0f5c64; font-weight: 600; margin-bottom: 8px; }
    .agency { font-size: 26px; font-weight: 600; }
    .agency i { font-style: normal; color: #2f8f4e; margin-right: 7px; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="kicker">Réalisation</p>
    <p class="lead">La boutique dans la poche</p>
    <div class="photo">
      <img class="bg-prop" src="prop-cushions.webp" alt="" />
      <div class="phone">
        <div class="notch"></div>
        <div class="screen">
          <img src="04-home-mobile.png" alt="Accueil mobile" />
        </div>
      </div>
    </div>
    <div class="footer">
      <p class="line">Coussins · Galettes · Packs · WhatsApp</p>
      <p class="made">Une réalisation</p>
      <p class="agency"><i>✦</i>revixa</p>
    </div>
  </div>
</body>
</html>
