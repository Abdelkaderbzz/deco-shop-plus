<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Catalogue — Mobile</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .stage {
      width: 1080px; height: 1080px;
      padding: 48px 48px 40px;
      background: #efece6;
      display: flex; flex-direction: column; align-items: center;
      font-family: Outfit, sans-serif; color: #1c2422;
    }
    .kicker {
      font-size: 13px; letter-spacing: 0.36em; text-transform: uppercase;
      color: #0f5c64; font-weight: 600; margin-bottom: 8px;
    }
    .lead {
      font-family: "Cormorant Garamond", serif;
      font-size: 46px; font-weight: 600; margin-bottom: 22px; text-align: center;
    }
    .photo {
      width: 100%; flex: 1; border-radius: 28px; overflow: hidden; position: relative;
      background: linear-gradient(165deg, #e8eeea, #d5dfdb 60%, #c8d4cf);
      box-shadow: 0 22px 50px rgba(15,92,100,.12);
    }
    .bg-prop {
      position: absolute; right: -6%; bottom: 4%; width: 62%;
      transform: rotate(5deg); border-radius: 16px;
      filter: drop-shadow(0 22px 28px rgba(13,21,20,.28));
    }
    .phone {
      position: absolute; left: 9%; top: 6%;
      width: 300px; background: #0c0e0d; border-radius: 38px; padding: 10px;
      border: 2px solid #2a312f; z-index: 2;
      box-shadow: 0 30px 50px rgba(13,21,20,.35);
    }
    .notch {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      width: 78px; height: 16px; background: #0c0e0d; border-radius: 16px; z-index: 3;
    }
    .screen { border-radius: 30px; overflow: hidden; aspect-ratio: 390/844; background: #111; }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .footer { margin-top: 18px; text-align: center; width: 100%; font-size: 15px; color: #6a7a76; }
    .agency { margin-top: 8px; font-size: 20px; font-weight: 600; }
    .agency i { font-style: normal; color: #2f8f4e; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="kicker">Réalisation</p>
    <p class="lead">La boutique dans la poche</p>
    <div class="photo">
      <img class="bg-prop" src="prop-cushions.webp" alt="" />
      <div class="phone">
        <div class="notch"></div>
        <div class="screen"><img src="04-home-mobile.png" alt="" /></div>
      </div>
    </div>
    <p class="footer">Coussins · Galettes · Packs · WhatsApp</p>
    <p class="agency"><i>✦</i>revixa</p>
  </div>
</body>
</html>
