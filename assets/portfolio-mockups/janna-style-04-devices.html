<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Web & mobile</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .stage {
      width: 1080px; height: 1920px;
      padding: 88px 64px 72px;
      background: #efece6;
      display: flex; flex-direction: column; align-items: center;
      font-family: Outfit, sans-serif; color: #1c2422;
    }
    .kicker {
      font-size: 13px; letter-spacing: 0.38em; text-transform: uppercase;
      color: #0f5c64; font-weight: 600; margin-bottom: 14px;
    }
    .lead {
      font-family: "Cormorant Garamond", serif;
      font-size: 52px; font-weight: 600; text-align: center;
      line-height: 1.08; margin-bottom: 42px; max-width: 13ch;
    }
    .photo {
      width: 100%; flex: 1; border-radius: 36px; overflow: hidden; position: relative;
      background: linear-gradient(165deg, #f4efe6, #e6dccb 50%, #d8ccb8);
      box-shadow: 0 28px 70px rgba(15, 92, 100, 0.12);
    }
    .laptop {
      position: absolute; left: 3%; top: 11%; width: 68%;
      filter: drop-shadow(0 30px 40px rgba(13,21,20,.28));
    }
    .lid {
      background: #151817; border: 10px solid #1f2422; border-bottom: 0;
      border-radius: 12px 12px 0 0; overflow: hidden; aspect-ratio: 16/10;
    }
    .lid img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .base { height: 14px; background: linear-gradient(180deg,#2a302e,#141716); border-radius: 0 0 8px 8px; }
    .phone {
      position: absolute; right: 6%; top: 18%; width: 268px;
      background: #0c0e0d; border-radius: 36px; padding: 9px;
      border: 2px solid #2a312f;
      box-shadow: 0 30px 50px rgba(13,21,20,.36); z-index: 2;
    }
    .ps { border-radius: 28px; overflow: hidden; aspect-ratio: 390/844; background: #111; }
    .ps img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .p1 { position: absolute; left: 7%; bottom: 6%; width: 250px; border-radius: 14px; filter: drop-shadow(0 16px 20px rgba(13,21,20,.25)); z-index: 3; }
    .p2 { position: absolute; right: 8%; bottom: 7%; width: 180px; border-radius: 14px; transform: rotate(-7deg); filter: drop-shadow(0 16px 20px rgba(13,21,20,.25)); z-index: 3; }
    .footer { margin-top: 36px; text-align: center; width: 100%; }
    .line { color: #6a7a76; font-size: 17px; margin-bottom: 22px; }
    .made { font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: #0f5c64; font-weight: 600; margin-bottom: 8px; }
    .agency { font-size: 26px; font-weight: 600; }
    .agency i { font-style: normal; color: #2f8f4e; margin-right: 7px; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="kicker">Web & mobile</p>
    <p class="lead">Un magasin élégant, partout</p>
    <div class="photo">
      <div class="laptop">
        <div class="lid"><img src="01-home-desktop.png" alt="Desktop" /></div>
        <div class="base"></div>
      </div>
      <div class="phone">
        <div class="ps"><img src="05-product-mobile.png" alt="Produit mobile" /></div>
      </div>
      <img class="p1" src="prop-galettes.webp" alt="" />
      <img class="p2" src="prop-cushion-red.webp" alt="" />
    </div>
    <div class="footer">
      <p class="line">Pensé pour le web et le téléphone</p>
      <p class="made">Une réalisation</p>
      <p class="agency"><i>✦</i>revixa</p>
    </div>
  </div>
</body>
</html>
